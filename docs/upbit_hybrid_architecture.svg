<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="980" viewBox="0 0 1600 980">
  <defs>
    <linearGradient id="bg2" x1="0" x2="1" y1="0" y2="1">
      <stop offset="0%" stop-color="#f7fbff"/>
      <stop offset="100%" stop-color="#edf3f8"/>
    </linearGradient>
    <linearGradient id="ws" x1="0" x2="1" y1="0" y2="0">
      <stop offset="0%" stop-color="#0f5d7a"/>
      <stop offset="100%" stop-color="#1389a9"/>
    </linearGradient>
    <linearGradient id="rest" x1="0" x2="1" y1="0" y2="0">
      <stop offset="0%" stop-color="#5a4f8b"/>
      <stop offset="100%" stop-color="#7a69b3"/>
    </linearGradient>
    <filter id="shadow2" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="10" stdDeviation="10" flood-color="#9db3c3" flood-opacity="0.25"/>
    </filter>
  </defs>
  <style>
    .title { font: 700 34px Arial, sans-serif; fill: #17324d; }
    .sub { font: 500 16px Arial, sans-serif; fill: #566f84; }
    .card { fill: #ffffff; stroke: #9cb7cb; stroke-width: 2; rx: 22; ry: 22; filter: url(#shadow2); }
    .wsCard { fill: url(#ws); rx: 22; ry: 22; filter: url(#shadow2); }
    .restCard { fill: url(#rest); rx: 22; ry: 22; filter: url(#shadow2); }
    .label { font: 700 22px Arial, sans-serif; fill: #17324d; }
    .text { font: 500 15px Arial, sans-serif; fill: #2a475d; }
    .whiteLabel { font: 700 22px Arial, sans-serif; fill: #ffffff; }
    .whiteText { font: 500 15px Arial, sans-serif; fill: #edf7ff; }
    .line { stroke: #88a9bf; stroke-width: 2.5; fill: none; }
    .badge { fill: #dfeef8; rx: 12; ry: 12; }
    .badgeText { font: 700 13px Arial, sans-serif; fill: #2e5876; }
  </style>

  <rect x="0" y="0" width="1600" height="980" fill="url(#bg2)"/>
  <text x="60" y="62" class="title">Upbit REST + WebSocket 혼합 아키텍처</text>
  <text x="60" y="92" class="sub">시장 데이터는 웹소켓 수집기 1개가 공유하고, 주문과 잔고는 기존 REST 경로를 유지하는 설계</text>

  <rect x="90" y="170" width="280" height="110" class="wsCard"/>
  <text x="125" y="212" class="whiteLabel">Upbit WebSocket</text>
  <text x="125" y="242" class="whiteText">trade / orderbook / candle</text>
  <text x="125" y="266" class="whiteText">실시간 시장 데이터 수신</text>

  <rect x="470" y="150" width="340" height="150" class="card"/>
  <rect x="495" y="170" width="96" height="24" class="badge"/>
  <text x="512" y="187" class="badgeText">수집기</text>
  <text x="495" y="225" class="label">run/upbit_market_data_stream.py</text>
  <text x="495" y="255" class="text">연결, 재연결, 구독, 파싱 담당</text>
  <text x="495" y="281" class="text">업비트 알트/BTC가 같은 스트림을 공유</text>

  <rect x="910" y="150" width="320" height="150" class="card"/>
  <rect x="935" y="170" width="96" height="24" class="badge"/>
  <text x="952" y="187" class="badgeText">상태</text>
  <text x="935" y="225" class="label">core/market_data/*</text>
  <text x="935" y="255" class="text">메모리 상태 + 캔들 집계 + 스냅샷 저장</text>
  <text x="935" y="281" class="text">1분봉 생성, 5분/15분 리샘플 준비</text>

  <rect x="1280" y="150" width="250" height="150" class="card"/>
  <rect x="1305" y="170" width="96" height="24" class="badge"/>
  <text x="1322" y="187" class="badgeText">저장</text>
  <text x="1305" y="225" class="label">logs/runtime/upbit_ws</text>
  <text x="1305" y="255" class="text">latest/*.json</text>
  <text x="1305" y="281" class="text">candles_1m/*.jsonl</text>

  <path d="M370 225 L470 225" class="line"/>
  <path d="M810 225 L910 225" class="line"/>
  <path d="M1230 225 L1280 225" class="line"/>

  <rect x="610" y="430" width="380" height="150" class="card"/>
  <rect x="635" y="450" width="110" height="24" class="badge"/>
  <text x="651" y="467" class="badgeText">공용 공급자</text>
  <text x="635" y="505" class="label">core/market_data/upbit_provider.py</text>
  <text x="635" y="535" class="text">웹소켓 스냅샷 우선, stale 시 REST fallback</text>
  <text x="635" y="561" class="text">전략 봇과 분석 수집기가 같은 인터페이스 사용</text>

  <path d="M800 300 L800 430" class="line"/>

  <rect x="120" y="690" width="290" height="150" class="card"/>
  <text x="150" y="730" class="label">upbit_ma_crossover_bot.py</text>
  <text x="150" y="760" class="text">알트 전략 본체</text>
  <text x="150" y="786" class="text">best bid / ohlcv를 provider에서 읽음</text>

  <rect x="470" y="690" width="290" height="150" class="card"/>
  <text x="500" y="730" class="label">upbit_btc_ema_trend_bot.py</text>
  <text x="500" y="760" class="text">BTC 전략 본체</text>
  <text x="500" y="786" class="text">5분/15분 계산용 캔들도 provider 사용</text>

  <rect x="820" y="690" width="290" height="150" class="card"/>
  <text x="850" y="730" class="label">analysis_log_collector.py</text>
  <text x="850" y="760" class="text">분석 수집기</text>
  <text x="850" y="786" class="text">중복 시세 조회를 줄이고 같은 데이터 공유</text>

  <rect x="1180" y="670" width="300" height="170" class="restCard"/>
  <text x="1220" y="712" class="whiteLabel">Upbit REST</text>
  <text x="1220" y="742" class="whiteText">balance / order / fallback</text>
  <text x="1220" y="768" class="whiteText">주문과 잔고는 기존 구조 유지</text>
  <text x="1220" y="794" class="whiteText">stale 시 필요한 심볼만 fallback</text>

  <path d="M700 580 L700 635 L265 635 L265 690" class="line"/>
  <path d="M800 580 L800 690" class="line"/>
  <path d="M900 580 L900 635 L965 635 L965 690" class="line"/>

  <path d="M410 760 L1180 760" class="line"/>
  <path d="M760 780 L1180 780" class="line"/>
  <path d="M1110 800 L1180 800" class="line"/>

  <rect x="70" y="900" width="1460" height="50" fill="#ffffff" stroke="#c7d8e6" stroke-width="1.5" rx="18" ry="18"/>
  <text x="95" y="931" class="text">핵심: 시장 데이터만 웹소켓으로 실시간화하고, 주문과 잔고는 보수적으로 REST를 유지하는 단계적 전환 구조입니다.</text>
</svg>
